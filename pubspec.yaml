name: bhagavad_gita_as_it_is
description: "Bhagavad gita as it is - The timeless wisdom of Bhagavad Gita by His Divine Grace A.C. Bhaktivedanta Swami Srila Prabhupada."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Local Database
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Local Preferences
  shared_preferences: ^2.2.3

  # Sharing
  share_plus: ^9.0.0

  # Internationalization & Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
    - assets/data/gita_seed.json
    - assets/data/chapters.json
